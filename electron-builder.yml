appId: com.drillsat.app
productName: DrillSAT
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
  - "!node_modules/**"   # main/preload/renderer are fully bundled by Vite; no runtime node_modules needed
extraResources:
  - from: data/bank
    to: bank
    filter: ["**/*"]
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: "DrillSAT-${version}-setup.${ext}"
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  perMachine: false
portable:
  artifactName: "DrillSAT-${version}-portable.exe"
# Auto-update feed (electron-updater): generates app-update.yml in the app and latest.yml next to the installer.
# Releases are uploaded with `gh release create`; electron-builder never publishes by itself (--publish never).
publish:
  provider: github
  owner: youngfalconstone
  repo: DrillSAT
  releaseType: release
